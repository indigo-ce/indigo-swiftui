name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-ios:
    name: Test iOS
    # Default Xcode on this image ships Swift 6.4+, required by
    # swift-tools-version in Package.swift.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install Tuist
        run: mise install

      - name: Install dependencies
        run: mise exec -- tuist install

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      - name: Run tests
        run: mise exec -- tuist test --platform ios
